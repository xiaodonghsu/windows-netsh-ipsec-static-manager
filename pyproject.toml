[project]
name = "ipsec-manager"
version = "0.1.0"
description = "Conservative local Windows IPsec filter list manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ipsec-manager = "ipsec_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

